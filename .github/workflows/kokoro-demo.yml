name: Produce Kokoro documentary demo

on:
  push:
    paths:
      - "scripts/render_kokoro_demo.py"
      - ".github/workflows/kokoro-demo.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile numpy
      - name: Render documentary
        run: python scripts/render_kokoro_demo.py --output output/why-humans-dream-kokoro.mp4 --voice af_heart
      - name: Inspect output
        run: |
          test -s output/why-humans-dream-kokoro.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/why-humans-dream-kokoro.mp4
      - name: Upload documentary
        uses: actions/upload-artifact@v4
        with:
          name: why-humans-dream-kokoro
          path: |
            output/why-humans-dream-kokoro.mp4
            output/subtitles.srt
            output/narration.wav
